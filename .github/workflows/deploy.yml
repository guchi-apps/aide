name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aide-production
  cancel-in-progress: true

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          HEAD_SHA=$(git rev-parse HEAD)

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-parse "$TAG")
            if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
              echo "Tag ${TAG} already points to HEAD"
              exit 0
            fi
            echo "::error::Tag ${TAG} already exists on ${TAG_SHA}, but HEAD is ${HEAD_SHA}. Bump package.json version before merging."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  deploy:
    runs-on: ubuntu-latest
    needs: tag
    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んでいたが、
    # サービスアカウントの日次レート制限を使い切ってフリート全体のデプロイが止まった
    # （guchi-apps/issue-deck#1302）。SERVER_* はorganizationの共通値（aide#1）。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する。
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      HOST: ${{ secrets.SERVER_HOST }}
      USERNAME: ${{ secrets.SERVER_USERNAME }}
      SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      # gateが置き場（/home/github-user/apps/aide）を固定するため使わなくなった（#662）。
      # マニフェストの行と合わせ、撤去は移行を確かめてから。
      TARGET_DIR: ${{ secrets.TARGET_DIR }}
      AIDE_AUTH_PASSWORD: ${{ secrets.AIDE_AUTH_PASSWORD }}
      AIDE_INGEST_SECRET: ${{ secrets.AIDE_INGEST_SECRET }}
      AIDE_READ_SECRET: ${{ secrets.AIDE_READ_SECRET }}
      AIDE_STATUS_SECRET: ${{ secrets.AIDE_STATUS_SECRET }}
      AIDE_WORK_REPORTS_READ_SECRET: ${{ secrets.AIDE_WORK_REPORTS_READ_SECRET }}
      SHARED_TOKEN_API_SECRET: ${{ secrets.SHARED_TOKEN_API_SECRET }}
      AIDE_OPS_DASHBOARD_TOKEN: ${{ secrets.AIDE_OPS_DASHBOARD_TOKEN }}
      AIDE_MYROOM_TOKEN: ${{ secrets.AIDE_MYROOM_TOKEN }}
      AIDE_MYROOM_CONTROL_TOKEN: ${{ secrets.AIDE_MYROOM_CONTROL_TOKEN }}
      AIDE_DAYSPAN_TOKEN: ${{ secrets.AIDE_DAYSPAN_TOKEN }}
      AIDE_DAYSPAN_WRITE_TOKEN: ${{ secrets.AIDE_DAYSPAN_WRITE_TOKEN }}
      AIDE_DAYSPAN_TASKS_WRITE_TOKEN: ${{ secrets.AIDE_DAYSPAN_TASKS_WRITE_TOKEN }}
      AIDE_DAYSPAN_TARGET_EMAIL: ${{ secrets.AIDE_DAYSPAN_TARGET_EMAIL }}
      AIDE_GITHUB_TOKEN: ${{ secrets.AIDE_GITHUB_TOKEN }}
      AIDE_GITHUB_ISSUE_TOKEN: ${{ secrets.AIDE_GITHUB_ISSUE_TOKEN }}
      AIDE_ISSUE_DECK_UPLOAD_TOKEN: ${{ secrets.AIDE_ISSUE_DECK_UPLOAD_TOKEN }}
      AIDE_ISSUE_DECK_REVIEW_AGENT_TOKEN: ${{ secrets.AIDE_ISSUE_DECK_REVIEW_AGENT_TOKEN }}
      AIDE_ASSET_MANAGER_ZAIM_SYNC_SECRET: ${{ secrets.AIDE_ASSET_MANAGER_ZAIM_SYNC_SECRET }}
      AIDE_BOT_TOKEN: ${{ secrets.AIDE_BOT_TOKEN }}
      AIDE_BOT_EMAIL: ${{ secrets.AIDE_BOT_EMAIL }}
      AIDE_RESEARCH_DESK_TOKEN: ${{ secrets.AIDE_RESEARCH_DESK_TOKEN }}
      AIDE_ZAIM_WRITE_SECRET: ${{ secrets.AIDE_ZAIM_WRITE_SECRET }}
      AIDE_ZAIM_CONSUMER_KEY: ${{ secrets.AIDE_ZAIM_CONSUMER_KEY }}
      AIDE_ZAIM_CONSUMER_SECRET: ${{ secrets.AIDE_ZAIM_CONSUMER_SECRET }}
      AIDE_ZAIM_ACCESS_TOKEN: ${{ secrets.AIDE_ZAIM_ACCESS_TOKEN }}
      AIDE_ZAIM_ACCESS_TOKEN_SECRET: ${{ secrets.AIDE_ZAIM_ACCESS_TOKEN_SECRET }}
      AIDE_ZAIM_WEB_UPSTREAM_URL: ${{ secrets.AIDE_ZAIM_WEB_UPSTREAM_URL }}
      AIDE_SUPABASE_URL: ${{ secrets.AIDE_SUPABASE_URL }}
      AIDE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.AIDE_SUPABASE_PUBLISHABLE_KEY }}
      AIDE_STATUS_ALLOWED_EMAILS: ${{ secrets.AIDE_STATUS_ALLOWED_EMAILS }}
      AIDE_IMAGE_MAIL_TOKEN: ${{ secrets.AIDE_IMAGE_MAIL_TOKEN }}
      AIDE_IMAGE_MAIL_TO: ${{ secrets.AIDE_IMAGE_MAIL_TO }}
      AIDE_IMAGE_MAIL_BCC: ${{ secrets.AIDE_IMAGE_MAIL_BCC }}
      AIDE_IMAGE_MAIL_FROM: ${{ secrets.AIDE_IMAGE_MAIL_FROM }}
      AIDE_NEWS_MAIL_TOKEN: ${{ secrets.AIDE_NEWS_MAIL_TOKEN }}
      AIDE_NEWS_MAIL_TO: ${{ secrets.AIDE_NEWS_MAIL_TO }}
      AIDE_NEWS_MAIL_BCC: ${{ secrets.AIDE_NEWS_MAIL_BCC }}
      AIDE_NEWS_MAIL_FROM: ${{ secrets.AIDE_NEWS_MAIL_FROM }}
      AIDE_GMAIL_CLIENT_ID: ${{ secrets.AIDE_GMAIL_CLIENT_ID }}
      AIDE_GMAIL_CLIENT_SECRET: ${{ secrets.AIDE_GMAIL_CLIENT_SECRET }}
      AIDE_GMAIL_REFRESH_TOKEN: ${{ secrets.AIDE_GMAIL_REFRESH_TOKEN }}
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}
      AIDE_BASE_URL: ${{ vars.AIDE_BASE_URL }}
      AIDE_ASSET_MANAGER_URL: ${{ vars.AIDE_ASSET_MANAGER_URL }}
      AIDE_BOT_URL: ${{ vars.AIDE_BOT_URL }}
      AIDE_RESEARCH_DESK_URL: ${{ vars.AIDE_RESEARCH_DESK_URL }}
      AIDE_ISSUE_DECK_URL: ${{ vars.AIDE_ISSUE_DECK_URL }}
      AIDE_IOS_TEAM_ID: ${{ vars.AIDE_IOS_TEAM_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ビルド成果物が無いため、ソースをそのまま送る。
      # Node 24 が .ts を型ストリッピングで直接実行し、実行時依存パッケージも無い。
      # package-lock.json はgateに `npm ci --omit=dev` を実行させるために含める（#662）。
      # 実行時依存が無い間は何も入らず従来（インストールしない）と同じ結果になり、
      # 将来 dependencies を足したときにそのまま本番へ入る。lockfile が無いとgateはインストールを飛ばす。
      - name: Create archive
        run: tar -czf deploy.tar.gz src deploy package.json package-lock.json README.md

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ env.SSH_PRIVATE_KEY }}
          known_hosts: placeholder
          if_key_exists: replace

      - name: Add known hosts
        run: ssh-keyscan -p "${SSH_PORT}" -H "${HOST}" >> ~/.ssh/known_hosts

      # **VPSのgate（/usr/local/sbin/app-deploy-gate。guchi-apps/vps#275）へ渡す**（#662）。
      # 鍵はこのアプリ専用で、VPSのauthorized_keysのcommand=がgateのアプリ名（aide。置き場
      # /home/github-user/apps/aide）を固定する。任意のシェルコマンドは実行できず、
      # upload・env・deployの3語だけが通る。旧配布物の削除・展開・.env更新・npm ci・
      # pm2の再起動（deploy/ecosystem.config.cjs が宣言する aide）・稼働版の照合はgate側が行う
      # （guchi-apps/vps#298・#300）。置き場はgateが決めるため TARGET_DIR は使わない。
      - name: Upload archive
        run: ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" upload < deploy.tar.gz

      # gateは .env の該当キーだけを書き換える（従来のように .env をまるごと上書きしない）。
      # 実行時に要る値は、従来どおり毎回ここから送る（aide#55。README「環境変数の配線」）。
      # トークン類は未発行でもデプロイを止めないよう `${VAR:-}` で空を許す。
      # 空ならAIDE側は「未設定」として振る舞い、そのツールだけが使えなくなる。
      - name: Send environment variables
        env:
          # 稼働中の版の照合に使う（#662）。gateが .env の APP_COMMIT_SHA と稼働中の
          # /api/app-version の sha を照合する（guchi-apps/vps#298）。コミットのSHAは公開情報なのでそのまま渡してよい。
          APP_COMMIT_SHA: ${{ github.sha }}
          AIDE_AUTH_PASSWORD: ${{ env.AIDE_AUTH_PASSWORD }}
          AIDE_BASE_URL: ${{ env.AIDE_BASE_URL }}
          AIDE_ASSET_MANAGER_URL: ${{ env.AIDE_ASSET_MANAGER_URL }}
          AIDE_BOT_URL: ${{ env.AIDE_BOT_URL }}
          AIDE_RESEARCH_DESK_URL: ${{ env.AIDE_RESEARCH_DESK_URL }}
          AIDE_ISSUE_DECK_URL: ${{ env.AIDE_ISSUE_DECK_URL }}
          AIDE_IOS_TEAM_ID: ${{ env.AIDE_IOS_TEAM_ID }}
          AIDE_INGEST_SECRET: ${{ env.AIDE_INGEST_SECRET }}
          AIDE_READ_SECRET: ${{ env.AIDE_READ_SECRET }}
          AIDE_STATUS_SECRET: ${{ env.AIDE_STATUS_SECRET }}
          AIDE_WORK_REPORTS_READ_SECRET: ${{ env.AIDE_WORK_REPORTS_READ_SECRET }}
          SHARED_TOKEN_API_SECRET: ${{ env.SHARED_TOKEN_API_SECRET }}
          AIDE_OPS_DASHBOARD_TOKEN: ${{ env.AIDE_OPS_DASHBOARD_TOKEN }}
          AIDE_MYROOM_TOKEN: ${{ env.AIDE_MYROOM_TOKEN }}
          AIDE_MYROOM_CONTROL_TOKEN: ${{ env.AIDE_MYROOM_CONTROL_TOKEN }}
          AIDE_DAYSPAN_TOKEN: ${{ env.AIDE_DAYSPAN_TOKEN }}
          AIDE_DAYSPAN_WRITE_TOKEN: ${{ env.AIDE_DAYSPAN_WRITE_TOKEN }}
          AIDE_DAYSPAN_TASKS_WRITE_TOKEN: ${{ env.AIDE_DAYSPAN_TASKS_WRITE_TOKEN }}
          AIDE_DAYSPAN_TARGET_EMAIL: ${{ env.AIDE_DAYSPAN_TARGET_EMAIL }}
          AIDE_GITHUB_TOKEN: ${{ env.AIDE_GITHUB_TOKEN }}
          AIDE_GITHUB_ISSUE_TOKEN: ${{ env.AIDE_GITHUB_ISSUE_TOKEN }}
          AIDE_ISSUE_DECK_UPLOAD_TOKEN: ${{ env.AIDE_ISSUE_DECK_UPLOAD_TOKEN }}
          AIDE_ISSUE_DECK_REVIEW_AGENT_TOKEN: ${{ env.AIDE_ISSUE_DECK_REVIEW_AGENT_TOKEN }}
          AIDE_ASSET_MANAGER_ZAIM_SYNC_SECRET: ${{ env.AIDE_ASSET_MANAGER_ZAIM_SYNC_SECRET }}
          AIDE_BOT_TOKEN: ${{ env.AIDE_BOT_TOKEN }}
          AIDE_BOT_EMAIL: ${{ env.AIDE_BOT_EMAIL }}
          AIDE_RESEARCH_DESK_TOKEN: ${{ env.AIDE_RESEARCH_DESK_TOKEN }}
          AIDE_ZAIM_WRITE_SECRET: ${{ env.AIDE_ZAIM_WRITE_SECRET }}
          AIDE_ZAIM_CONSUMER_KEY: ${{ env.AIDE_ZAIM_CONSUMER_KEY }}
          AIDE_ZAIM_CONSUMER_SECRET: ${{ env.AIDE_ZAIM_CONSUMER_SECRET }}
          AIDE_ZAIM_ACCESS_TOKEN: ${{ env.AIDE_ZAIM_ACCESS_TOKEN }}
          AIDE_ZAIM_ACCESS_TOKEN_SECRET: ${{ env.AIDE_ZAIM_ACCESS_TOKEN_SECRET }}
          AIDE_ZAIM_WEB_UPSTREAM_URL: ${{ env.AIDE_ZAIM_WEB_UPSTREAM_URL }}
          AIDE_SUPABASE_URL: ${{ env.AIDE_SUPABASE_URL }}
          AIDE_SUPABASE_PUBLISHABLE_KEY: ${{ env.AIDE_SUPABASE_PUBLISHABLE_KEY }}
          AIDE_STATUS_ALLOWED_EMAILS: ${{ env.AIDE_STATUS_ALLOWED_EMAILS }}
          AIDE_IMAGE_MAIL_TOKEN: ${{ env.AIDE_IMAGE_MAIL_TOKEN }}
          AIDE_IMAGE_MAIL_TO: ${{ env.AIDE_IMAGE_MAIL_TO }}
          AIDE_IMAGE_MAIL_BCC: ${{ env.AIDE_IMAGE_MAIL_BCC }}
          AIDE_IMAGE_MAIL_FROM: ${{ env.AIDE_IMAGE_MAIL_FROM }}
          AIDE_NEWS_MAIL_TOKEN: ${{ env.AIDE_NEWS_MAIL_TOKEN }}
          AIDE_NEWS_MAIL_TO: ${{ env.AIDE_NEWS_MAIL_TO }}
          AIDE_NEWS_MAIL_BCC: ${{ env.AIDE_NEWS_MAIL_BCC }}
          AIDE_NEWS_MAIL_FROM: ${{ env.AIDE_NEWS_MAIL_FROM }}
          AIDE_GMAIL_CLIENT_ID: ${{ env.AIDE_GMAIL_CLIENT_ID }}
          AIDE_GMAIL_CLIENT_SECRET: ${{ env.AIDE_GMAIL_CLIENT_SECRET }}
          AIDE_GMAIL_REFRESH_TOKEN: ${{ env.AIDE_GMAIL_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          # gateは標準入力を1行1変数（KEY=VALUE）で受けるため、改行を含む値は送れない。
          # gateは値を KEY="VALUE" の形で書き、`"` と `\` をエスケープするが、Nodeの --env-file
          # （ecosystem の node_args）はそのエスケープを戻さず値が変わってしまう。黙って壊れた値で
          # 起動させないよう、`"`・`\` を含む値もここで止める。
          for name in AIDE_AUTH_PASSWORD AIDE_BASE_URL AIDE_ASSET_MANAGER_URL AIDE_BOT_URL AIDE_RESEARCH_DESK_URL AIDE_ISSUE_DECK_URL AIDE_IOS_TEAM_ID AIDE_INGEST_SECRET AIDE_READ_SECRET AIDE_STATUS_SECRET AIDE_WORK_REPORTS_READ_SECRET SHARED_TOKEN_API_SECRET AIDE_OPS_DASHBOARD_TOKEN AIDE_MYROOM_TOKEN AIDE_MYROOM_CONTROL_TOKEN AIDE_DAYSPAN_TOKEN AIDE_DAYSPAN_WRITE_TOKEN AIDE_DAYSPAN_TASKS_WRITE_TOKEN AIDE_DAYSPAN_TARGET_EMAIL AIDE_GITHUB_TOKEN AIDE_GITHUB_ISSUE_TOKEN AIDE_ISSUE_DECK_UPLOAD_TOKEN AIDE_ISSUE_DECK_REVIEW_AGENT_TOKEN AIDE_ASSET_MANAGER_ZAIM_SYNC_SECRET AIDE_BOT_TOKEN AIDE_BOT_EMAIL AIDE_RESEARCH_DESK_TOKEN AIDE_ZAIM_WRITE_SECRET AIDE_ZAIM_CONSUMER_KEY AIDE_ZAIM_CONSUMER_SECRET AIDE_ZAIM_ACCESS_TOKEN AIDE_ZAIM_ACCESS_TOKEN_SECRET AIDE_ZAIM_WEB_UPSTREAM_URL AIDE_SUPABASE_URL AIDE_SUPABASE_PUBLISHABLE_KEY AIDE_STATUS_ALLOWED_EMAILS AIDE_IMAGE_MAIL_TOKEN AIDE_IMAGE_MAIL_TO AIDE_IMAGE_MAIL_BCC AIDE_IMAGE_MAIL_FROM AIDE_NEWS_MAIL_TOKEN AIDE_NEWS_MAIL_TO AIDE_NEWS_MAIL_BCC AIDE_NEWS_MAIL_FROM AIDE_GMAIL_CLIENT_ID AIDE_GMAIL_CLIENT_SECRET AIDE_GMAIL_REFRESH_TOKEN; do
            case "${!name:-}" in
              *$'\n'*) echo "::error::${name} が改行を含むためgateへ送れません"; exit 1 ;;
              *'"'*|*'\'*) echo "::error::${name} が \" か \\ を含むため、gateが書く .env をNodeが正しく読めません"; exit 1 ;;
            esac
          done
          # 待受ポートはシークレットではなく設定値として平文で持つ
          # （guchi-apps/docs の standards/ports.md「ポート番号は 1Password で管理しない」。#73）。
          # HOST はサーバーの待受アドレス。ジョブの env の HOST（SSH先）とは別物なので固定値で書く。
          {
            printf '%s\n' "NODE_ENV=production" "PORT=3114" "HOST=127.0.0.1"
            # 稼働中のコミット（#662）。/api/app-version がそのまま返し、gateが照合する。
            printf '%s\n' "APP_COMMIT_SHA=${APP_COMMIT_SHA}"
            printf '%s\n' "AIDE_AUTH_PASSWORD=${AIDE_AUTH_PASSWORD}"
            printf '%s\n' "AIDE_BASE_URL=${AIDE_BASE_URL}"
            printf '%s\n' "AIDE_ASSET_MANAGER_URL=${AIDE_ASSET_MANAGER_URL:-https://asset.gucchii.com}"
            printf '%s\n' "AIDE_BOT_URL=${AIDE_BOT_URL:-}"
            printf '%s\n' "AIDE_RESEARCH_DESK_URL=${AIDE_RESEARCH_DESK_URL:-}"
            printf '%s\n' "AIDE_ISSUE_DECK_URL=${AIDE_ISSUE_DECK_URL:-}"
            printf '%s\n' "AIDE_IOS_TEAM_ID=${AIDE_IOS_TEAM_ID:-}"
            printf '%s\n' "AIDE_INGEST_SECRET=${AIDE_INGEST_SECRET}"
            printf '%s\n' "AIDE_READ_SECRET=${AIDE_READ_SECRET:-}"
            # ops-dashboard向けの動作状況API（#276）。空なら /api/status・/api/status/checks は503を返す。
            # 値はissue-deckの共有トークンAPI（AIDE_STATUS_TOKEN）を優先し、これは取得できなかった
            # ときのフォールバックとして残している（aide#509。issue-deckへの移行が定着したら外す）。
            printf '%s\n' "AIDE_STATUS_SECRET=${AIDE_STATUS_SECRET:-}"
            # dotの作業報告の読み取りAPI（#609）。空なら /api/work-reports は503を返す。
            printf '%s\n' "AIDE_WORK_REPORTS_READ_SECRET=${AIDE_WORK_REPORTS_READ_SECRET:-}"
            # issue-deckの共有トークンAPIを呼ぶための認証値（aide#509）。空なら共有トークンは
            # 取得できず、各所は自分の環境変数（AIDE_STATUS_SECRET等）だけで動く。
            printf '%s\n' "SHARED_TOKEN_API_SECRET=${SHARED_TOKEN_API_SECRET:-}"
            printf '%s\n' "AIDE_OPS_DASHBOARD_TOKEN=${AIDE_OPS_DASHBOARD_TOKEN:-}"
            printf '%s\n' "AIDE_MYROOM_TOKEN=${AIDE_MYROOM_TOKEN:-}"
            printf '%s\n' "AIDE_MYROOM_CONTROL_TOKEN=${AIDE_MYROOM_CONTROL_TOKEN:-}"
            printf '%s\n' "AIDE_DAYSPAN_TOKEN=${AIDE_DAYSPAN_TOKEN:-}"
            printf '%s\n' "AIDE_DAYSPAN_WRITE_TOKEN=${AIDE_DAYSPAN_WRITE_TOKEN:-}"
            printf '%s\n' "AIDE_DAYSPAN_TASKS_WRITE_TOKEN=${AIDE_DAYSPAN_TASKS_WRITE_TOKEN:-}"
            printf '%s\n' "AIDE_DAYSPAN_TARGET_EMAIL=${AIDE_DAYSPAN_TARGET_EMAIL:-}"
            printf '%s\n' "AIDE_GITHUB_TOKEN=${AIDE_GITHUB_TOKEN:-}"
            printf '%s\n' "AIDE_GITHUB_ISSUE_TOKEN=${AIDE_GITHUB_ISSUE_TOKEN:-}"
            printf '%s\n' "AIDE_ISSUE_DECK_UPLOAD_TOKEN=${AIDE_ISSUE_DECK_UPLOAD_TOKEN:-}"
            printf '%s\n' "AIDE_ISSUE_DECK_REVIEW_AGENT_TOKEN=${AIDE_ISSUE_DECK_REVIEW_AGENT_TOKEN:-}"
            printf '%s\n' "AIDE_ASSET_MANAGER_ZAIM_SYNC_SECRET=${AIDE_ASSET_MANAGER_ZAIM_SYNC_SECRET:-}"
            printf '%s\n' "AIDE_BOT_TOKEN=${AIDE_BOT_TOKEN:-}"
            printf '%s\n' "AIDE_BOT_EMAIL=${AIDE_BOT_EMAIL:-}"
            printf '%s\n' "AIDE_RESEARCH_DESK_TOKEN=${AIDE_RESEARCH_DESK_TOKEN:-}"
            # Zaimへの支出登録（#37）。5つとも空なら /api/zaim/* は503を返し、口が開かない。
            # OAuthの4つは dev.zaim.net で発行したもので、巡回に使う storage state とは別物。
            printf '%s\n' "AIDE_ZAIM_WRITE_SECRET=${AIDE_ZAIM_WRITE_SECRET:-}"
            printf '%s\n' "AIDE_ZAIM_CONSUMER_KEY=${AIDE_ZAIM_CONSUMER_KEY:-}"
            printf '%s\n' "AIDE_ZAIM_CONSUMER_SECRET=${AIDE_ZAIM_CONSUMER_SECRET:-}"
            printf '%s\n' "AIDE_ZAIM_ACCESS_TOKEN=${AIDE_ZAIM_ACCESS_TOKEN:-}"
            printf '%s\n' "AIDE_ZAIM_ACCESS_TOKEN_SECRET=${AIDE_ZAIM_ACCESS_TOKEN_SECRET:-}"
            # Web版の入力画面からの登録の中継先（#215）。Playwrightとログイン状態はサブPCにしか
            # 無いため、VPSは自分で画面を操作せずここへ中継する。空なら中継せず、
            # POST /api/zaim/payment/web は storage state が無いまま失敗する。
            printf '%s\n' "AIDE_ZAIM_WEB_UPSTREAM_URL=${AIDE_ZAIM_WEB_UPSTREAM_URL:-}"
            # 動作状況ページのGoogleログイン（#90）。3つとも空ならパスワードでのログインになる。
            # **半端に設定するとサーバーが起動しない**（許可メールだけ空の状態＝Googleアカウントが
            # あれば誰でも開ける状態を作らないため）。設定するなら3つまとめて。
            printf '%s\n' "AIDE_SUPABASE_URL=${AIDE_SUPABASE_URL:-}"
            printf '%s\n' "AIDE_SUPABASE_PUBLISHABLE_KEY=${AIDE_SUPABASE_PUBLISHABLE_KEY:-}"
            printf '%s\n' "AIDE_STATUS_ALLOWED_EMAILS=${AIDE_STATUS_ALLOWED_EMAILS:-}"
            # 画像メール送信API（#230）。Research Desk側から届くリクエストを認証するトークンと、
            # 送信元GmailのOAuth資格情報。いずれか欠けると /api/image-mail/send は503を返す。
            printf '%s\n' "AIDE_IMAGE_MAIL_TOKEN=${AIDE_IMAGE_MAIL_TOKEN:-}"
            printf '%s\n' "AIDE_IMAGE_MAIL_TO=${AIDE_IMAGE_MAIL_TO:-}"
            printf '%s\n' "AIDE_IMAGE_MAIL_BCC=${AIDE_IMAGE_MAIL_BCC:-}"
            printf '%s\n' "AIDE_IMAGE_MAIL_FROM=${AIDE_IMAGE_MAIL_FROM:-}"
            # 業界ニュース週報メール送信API（#257）。トークン・宛先・BCC・送信元は画像メールとは
            # 別の値。Gmail資格情報は画像メールと共用する。
            printf '%s\n' "AIDE_NEWS_MAIL_TOKEN=${AIDE_NEWS_MAIL_TOKEN:-}"
            printf '%s\n' "AIDE_NEWS_MAIL_TO=${AIDE_NEWS_MAIL_TO:-}"
            printf '%s\n' "AIDE_NEWS_MAIL_BCC=${AIDE_NEWS_MAIL_BCC:-}"
            printf '%s\n' "AIDE_NEWS_MAIL_FROM=${AIDE_NEWS_MAIL_FROM:-}"
            printf '%s\n' "AIDE_GMAIL_CLIENT_ID=${AIDE_GMAIL_CLIENT_ID:-}"
            printf '%s\n' "AIDE_GMAIL_CLIENT_SECRET=${AIDE_GMAIL_CLIENT_SECRET:-}"
            printf '%s\n' "AIDE_GMAIL_REFRESH_TOKEN=${AIDE_GMAIL_REFRESH_TOKEN:-}"
          } | ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" env

      # gateは稼働版の照合（/api/app-version の sha が APP_COMMIT_SHA と一致するまで最大60秒）まで行い、
      # 一致しなければ失敗する。/health は旧版が動いたままでも 200 を返すため成功の根拠にしない（#662）。
      - name: Deploy and restart
        run: ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" deploy

  # GitHub Releaseの作成はこのジョブが担う。**他リポジトリにある独立した release.yml
  # （タグpushを起点にReleaseを作る）はaideには置かない**（aide#6で判断）。
  # release.yml が要るのは手動でタグをpushする運用があるリポジトリで、GITHUB_TOKEN起点の
  # タグpushは他のworkflowを起動しないという仕様の穴埋めが目的。aideのタグは常に上の
  # tagジョブが作り、その延長でここがReleaseまで作るため、二重に持つ必要がない。
  release:
    runs-on: ubuntu-latest
    needs: [tag, deploy]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: meta
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          skip_if_release_exists: true

  notify:
    runs-on: ubuntu-latest
    needs: [tag, deploy]
    if: always()
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine workflow status
        id: status
        run: |
          tag="${{ needs.tag.result }}"
          deploy="${{ needs.deploy.result }}"
          if [ "$tag" = "success" ] && [ "$deploy" = "success" ]; then
            result=success
          elif [ "$tag" = "cancelled" ] || [ "$deploy" = "cancelled" ]; then
            result=cancelled
          else
            result=failure
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Signaly に通知
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP: aide
          NOTIFY_KIND: デプロイ
          NOTIFY_STATUS: ${{ steps.status.outputs.result }}
        run: bash .github/scripts/signaly-notify.sh

  # リリース通知はCI・デプロイとは別のチャンネルへ送る（guchi-apps/issue-deck#2391）。
  # 上の notify ジョブが送る「デプロイ」の通知は1日に何件も流れるため、月に数回のリリースが
  # その中に埋もれる。宛先の出し分けは signaly-notify.sh が NOTIFY_KIND で行う。
  notify-release:
    runs-on: ubuntu-latest
    needs: [tag, deploy, release]
    # release がスキップされた場合（deployが失敗し、GitHub Releaseを作っていない場合）は
    # 通知するリリースが無い。deployの失敗そのものは notify ジョブが送る。
    if: always() && needs.release.result != 'skipped'
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      # 通知スクリプトとリリース本文（.github/release-notes.md）を読むために要る。
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Signaly に通知
        # 通知が届かないことでリリース済みのrunを赤くしない（guchi-apps/issue-deck#2237）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          # リリース専用チャンネルのwebhook。**organization secretが未登録のあいだは空が渡り、
          # スクリプトが従来のCI・デプロイ用チャンネルへフォールバックする**ので、
          # 登録の順序を気にせず足してよい（#2391）。
          SIGNALY_RELEASE_WEBHOOK_URL: ${{ secrets.SIGNALY_RELEASE_WEBHOOK_URL }}
          NOTIFY_APP: aide
          NOTIFY_KIND: リリース
          NOTIFY_STATUS: ${{ needs.release.result }}
          NOTIFY_VERSION: ${{ needs.tag.outputs.tag }}
        run: bash .github/scripts/signaly-notify.sh
