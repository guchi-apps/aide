<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AIDE">
  <!--
    AIDEのアイコンの正はこの1枚。案5「生活のコンパス」は、生活情報を集めるハブが
    日々の判断の方角を示す役割を表す。淡い青をベースに、濃い青の円と白い針を置き、
    小さな表示でも輪郭を保てるようにした。

    同じ絵をPNGへ書き出したものが icon-512.png / icon-192.png / apple-touch-icon.png /
    favicon-32.png で、書き出しは scripts/build-icons.sh が行う。**PNGを直接編集しないこと**
    （次にスクリプトを流した時点で戻る）。

    描くときの制約は2つ。
    - 背景は角を丸めず512x512いっぱいに塗る。maskable（Androidのアダプティブアイコン）として
      名乗っており、角を透明にすると端末側の切り抜き形によっては地が透ける。
    - 絵は中心から半径204.8px以内に収める。maskableの安全領域がそこまでで、外は
      切り落とされうる。この絵の最も外側はコンパス本体（半径156px）。
  -->
  <rect width="512" height="512" fill="#d8f2fa"/>

  <!-- 生活情報のハブ。淡い青地とのコントラストで、32pxでも円の輪郭を残す。 -->
  <circle cx="256" cy="256" r="156" fill="#1b5a75"/>
  <circle cx="256" cy="256" r="113" fill="none" stroke="#7bc7e6" stroke-width="26"/>

  <!-- 北東を向く針は「次に進む方角」を示す。白い面を大きく取り、小サイズで潰れないようにする。 -->
  <path d="M313 199 269 284 199 313 243 228z" fill="#ffffff"/>
  <circle cx="256" cy="256" r="18" fill="#2f91bd"/>
</svg>
