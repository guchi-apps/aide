<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AIde">
  <!--
    AIdeのアイコンの正はこの1枚。ワードマーク（src/web/brand.ts）の「A＋開いたコンパスリング＋
    白い針」と同じ字形を、氷青の地に1つだけ置いている。**パスの文字列はbrand.tsと同一に保つ**
    （食い違うと brand.test.ts が落ちる）。字形を直すときはbrand.tsを直し、ここへ写す。

    同じ絵をPNGへ書き出したものが icon-512.png / icon-192.png / apple-touch-icon.png /
    favicon-32.png で、書き出しは scripts/build-icons.sh が行う。**PNGを直接編集しないこと**
    （次にスクリプトを流した時点で戻る）。

    描くときの制約は2つ。
    - 背景は角を丸めず512x512いっぱいに塗る。maskable（Androidのアダプティブアイコン）として
      名乗っており、角を透明にすると端末側の切り抜き形によっては地が透ける。丸みはOS側のマスクに任せる。
    - 絵は中心から半径204.8px以内に収める。maskableの安全領域がそこまでで、外は切り落とされうる。
      字形の最小外接円（半径242.7）を倍率0.82で写しているので、最も外側で半径199px。
  -->
  <rect width="512" height="512" fill="#a9e0f7"/>

  <g transform="translate(256 256) scale(0.82) translate(-250 -248.9)" fill="#0b5075">
    <path d="M421.4 76.5 A244 244 0 0 0 43.4 376.5 L76.9 321.3 A190 190 0 0 1 384.6 116 Z"/>
    <path d="M225 108 Q232 98 245 98 L283 98 Q296 98 302 108 L398 362 L398 443 L345 443 L302 337 L165 337 L107 433 L60 380 Z"/>
    <path d="M305 190 L259 291 L160 338 L205 237 Z" fill="#ffffff"/>
    <circle cx="232" cy="264" r="20"/>
  </g>
</svg>
